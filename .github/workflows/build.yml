name: Build AFWall+ APK

on:
  workflow_dispatch: # Sadece manuel tetiklenebilir

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AFWall Repository
        uses: actions/checkout@v4
        with:
          repository: ukanth/afwall
          path: afwall-source
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        working-directory: ./afwall-source
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./afwall-source
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AFWall-Debug-APK
          path: afwall-source/app/build/outputs/apk/debug/app-debug.apk
